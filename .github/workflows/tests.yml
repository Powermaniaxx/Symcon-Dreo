name: PHP module tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, pcntl
          coverage: none
      - name: PHP syntax
        run: find DreoHeater libs tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
      - run: php tests/websocket-integration.php
      - run: php tests/http-integration.php
